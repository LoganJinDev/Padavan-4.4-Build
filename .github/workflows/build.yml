name: Build Firmware

on:
  # 只保留手动触发。原先的 push 触发会在每次推分支时自动编 K2P/K2P-USB 并发布 Release，
  # 把这个 GHL 仓库的历史搅乱。等 GHL 分支稳定后再改回 push 自动构建。
  workflow_dispatch:
    inputs:
      target:
        description: "Select router device"
        required: true
        type: choice
        options: [GHL, K2P, K2P-USB]
        default: GHL
      toolchain:
        description: "Select compilation toolchain"
        required: true
        type: choice
        options: [mipsel-linux-musl, mipsel-linux-uclibc]
        default: mipsel-linux-musl

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        target: ["${{ inputs.target }}"]
        toolchain: ["${{ inputs.toolchain }}"]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.24.x'
          check-latest: true
          cache: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev
          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> $GITHUB_ENV

      - name: Build Firmware
        run: |
          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}-${{ env.BUILD_DATE }}
          path: trunk/images/*.trx

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          commit: ${{ github.sha }}
          tag: ${{ env.BUILD_DATE }}
          artifacts: trunk/images/*.trx
          allowUpdates: true
          omitBodyDuringUpdate: true

      - uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 0
          keep_minimum_runs: 1